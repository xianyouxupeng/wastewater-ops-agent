# ===== 厂情档案示例文件（全空模板）=====
# 本文件只是格式示例，程序不读取它。
# 真实档案由「🏭 厂情档案」界面表单填写后自动写入 data/plant_profile.yaml（该文件请勿提交 git）。
# 原则：所有厂内信息以用户填写为准——留空的字段不注入 prompt，系统不会预置任何"典型厂"数据。
#
# 字段格式说明（填写时参考）：
#   排放限值.氨氮: "5(8)" 表示常规限值 5、季节性（水温≤12℃）限值 8
#   设计参数/设计规模: 可填区间或自由文本，如 "3000-4500"、"2 万吨/日"
#   工艺: 界面多选组合自动拼接（如 "A²/O+高效沉淀池"），也可自由填写
#
# 填写后文件长这样（值仅供参考格式，实际以本厂为准）：
#
# 厂名: ""
# 工艺: ""
# 设计规模: ""
# 排放标准: ""
# 排放限值: {COD: , 氨氮: "", TN: , TP: , SS: }
# 设计参数: {MLSS: "", 泥龄: "", DO: "", 内回流比: ""}
# 常用药剂: {除磷: "", 碳源: "", 消毒: ""}
# 主要设备: ""
# 特殊说明: ""
